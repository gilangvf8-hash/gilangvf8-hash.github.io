name: SEO Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build Jekyll
        run: bundle exec jekyll build

      - name: Compress HTML
        run: |
          find _site -name "*.html" -exec sed -i '/^\s*$/d' {} \;

      - name: Compress CSS
        run: |
          find _site -name "*.css" -exec gzip -9 -k {} \;

      - name: Compress JS
        run: |
          find _site -name "*.js" -exec gzip -9 -k {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
